# config/settings.yaml

proxy: "http://127.0.0.1:7890"

vlm_parser:
  batch_size: 20
  batch_polling_timeout_seconds: 28800 # 8 hours
  sleep_interval: 600
  parsing_prompt_path: "config/prompts/pdf_parsing.md"
  requests_path: "data/cache/pdf_parsing_requests.jsonl"
  state_file_path: "data/cache/processing_state.json"
  input_dir: "data/raw_pdfs/"
  output_dir: "data/processed_jsons/"

llm:
  provider: QWEN                   # GEMINI
  model: qwen3-max                 # gemini-2.5-pro  qwen-plus
  api_key: ${QWEN_API_KEY}         # ${GEMINI_API_KEY}
  batch_mode: true                 # 是否启用批处理
  temperature: 0.1                 # 控制生成的稳定性
  top_p: 0.9

  pdf_parser:
    input_dir: "data/raw_pdfs"
    output_dir: "data/processed_jsons"

loader:
  source_json_dir: "data/processed_jsons/"
  output_dir: "data/chunks/"
  output_format: "jsonl"  # jsonl, json, or parquet
  chunk_size: 1000  # 每个文本块的目标大小 (字符数)
  chunk_overlap: 200  # 相邻文本块之间的重叠大小 (字符数)
  split_table_chart: true  # 是否将表格按行、图表按数据点拆分为独立句子，避免被切分
  filename_map:
    jsonl: "text_units.jsonl"
    json: "text_units.json"
    parquet: "text_units.parquet"

extraction:
  input_dir: "data/chunks"
  input_filename: "text_units.jsonl"
  output_dir: "data/graphs/extracted"
  output_filename: "extracted_graph.jsonl"
  requests_dir: "data/cache" # 临时存放批量请求文件的目录
  prompt_path: "config/prompts/text_to_graph.md"
  media_prompts:
    table: "config/prompts/table_to_graph.md"
    chart: "config/prompts/chart_to_graph.md"
    schematic: "config/prompts/schematic_to_graph.md"
    photograph: "config/prompts/photograph_to_graph.md"

table_extraction:
  input_dir: "data/processed_jsons"  # VLM 解析后的 JSON 文件目录
  output_dir: "data/chunks"  # 中间文件保存位置（与 loader 一致）
  output_filename: "table_units.jsonl"  # 表格 text units 文件
  graph_output_dir: "data/graphs/extracted"  # 图谱输出目录
  graph_output_filename: "extracted_table_graph.jsonl"  # 表格图谱文件
  requests_dir: "data/cache"  # 批量请求文件目录
  requests_filename: "extraction_table_requests.jsonl"  # 批量请求文件名
  prompt_path: "config/prompts/table_to_graph.md"

abstract_extraction:
  input_excel: "data/papers/superalloy_research.xlsx"  # Excel 文件路径
  output_dir: "data/chunks"  # abstract_units.jsonl 保存位置
  output_filename: "abstract_units.jsonl"  # 摘要 text units 文件
  graph_output_dir: "data/graphs/extracted"  # 图谱输出目录
  graph_output_filename: "extracted_abstract_graph.jsonl"  # 摘要图谱文件
  requests_dir: "data/cache"  # 批量请求文件目录
  requests_filename: "extraction_abstract_requests.jsonl"  # 批量请求文件名

image_extraction:
  input_dir: "data/processed_jsons"  # VLM 解析后的 JSON 文件目录
  output_dir: "data/chunks"  # 中间文件保存位置（与 loader 一致）
  output_filename: "image_units.jsonl"  # 图片 text units 文件
  graph_output_dir: "data/graphs/extracted"  # 图谱输出目录
  graph_output_filename: "extracted_image_graph.jsonl"  # 图片图谱文件
  requests_dir: "data/cache"  # 批量请求文件目录
  requests_filename: "extraction_image_requests.jsonl"  # 批量请求文件名

enrich_extraction:
  extracted_dir: "data/graphs/extracted"  # 提取的图谱存放目录
  enriched_dir: "data/graphs/enriched"  # 富化后的图谱存放目录
  enriched_filename: "enriched_graph.jsonl"  # 富化图谱文件名

graph_builder:
  input_path: "data/graphs/enriched/enriched_graph.jsonl"
  disambiguation_graph_path: "data/graphs/disambiguation_graph.json"
  merged_graph_path: "data/graphs/merged_graph.json"
  output_graph_path: "data/graphs/final_graph_develop.json"
  community_reports_path: "data/reports/community_summaries_develop.jsonl"
  disambiguation_requests_path: "data/cache/disambiguation_requests.jsonl"
  embedding_requests_path: "data/cache/entities_embedding_requests.jsonl"
  merge_requests_path: "data/cache/entities_merge_requests.jsonl"
  community_requests_path: "data/cache/community_detection.jsonl"
  prompt_dir: "config/prompts"

  sleep_interval: 600
  community_summary_max_report_words: 1000
  community_summary_used_entities_num: 25
  community_summary_used_relationships_num: 50
  community_importance_weight_alpha: 0.8 # 重要性权重的alpha值
  enable_entity_merge: True
  entity_merge_topk: 10
  entity_merge_min_sim: 0.9
  embedding_batch_size: 10000 # 每批次处理的实体嵌入数量和LLM仲裁数量，避免API配额错误
  
  similarity_algorithm: "auto"  # 可选值: "hnsw", "brute_force", "auto"  # 实体合并相似度计算算法配置
  auto_algorithm_threshold: 5000  # 自动模式下的切换阈值（实体数量）

  hnsw_params:
    auto_tune: true  # 是否自动计算参数（基于数据规模的启发式规则） # HNSW 参数配置
    quality_level: "balanced"  # 质量级别: "fast", "balanced", "accurate"
    # 手动配置参数（当 auto_tune=false 时生效）
    M: 16
    ef_construction: 200
    ef_search: 100  # 最小值100，保证高召回率
  # 人工审核配置
  enable_manual_review: False # 是否启用人工审核功能
  manual_review_sample_size: 5 # 人工审核抽样数量
  manual_review_output_dir: "data/reports/manual_review" # 人工审核输出目录


  use_hierarchical_communities: true  # true: 使用递归分层Leiden算法，支持多层级社区结构   # false: 使用传统扁平化Leiden算法（向后兼容）
  max_community_level: 3  # 最大递归层级（默认10，防止无限递归）
  min_community_size: 10  # 当社区节点数少于此值时，不再进行细分（默认10）

  # 如果指定，会将完整的社区层级结构保存为CSV文件
  # 包含：community_id, level, title, parent_id, children_ids, node_ids, node_count, is_projected
  hierarchical_communities_path: "data/reports/hierarchical_communities.csv"


embedding:
  model: "text-embedding-v4"  #"gemini-embedding-001""text-embedding-v4"
  dimensionality: 1024
  input_text_units_path: "data/chunks/text_units.jsonl"
  input_graph_path: "data/graphs/final_graph_develop.json"
  input_community_report_path: "data/reports/community_summaries_develop.jsonl"
  input_id_maps_path: "data/cache/community_detection_id_maps_develop.json"
  output_db_path: "data/embeddings/multicommunities.db"  #no_entities_merge embedding.db
  output_db_text_path: "data/embeddings/text.db"
  output_text_table_name: "text"
  requests_path: "data/cache"
  sleep_interval: 60
  batch_size: 10000  # 每批次处理的嵌入数量，避免API配额错误

query:
  top_k: 20
  generation_model: "qwen3-max"  #gemini-2.5-pro""qwen3-max"
  temperature: 0.1
  top_p: 0.9
  search_config: true # allow_general_knowledge or not
  local_top_k: 20
  max_local_context_tokens: 30000
  k_hop: 1  # K-hop邻域扩展深度 (1或2)
  drift_k_followups: 2  # 当启用drift时，允许的后续问题数量
  drift_max_steps: 2 # 当启用drift时，最大漂移步数

  # 全局查询社区层级配置
  default_community_level: 3  # 默认查询 Level 1（未指定时使用）
  enable_dynamic_level_selection: true  # 启用LLM动态层级选择

  # 层级到top_k的映射（固定配置，不由LLM决定）
  level_top_k_mapping:
    0: 2      # Level 0: 全局主题总览，社区数量少
    1: 10     # Level 1: 主要研究方向，中等数量
    2: 20     # Level 2: 具体子主题，较多社区
    3: 30    # Level 3: 细粒度概念，大量社区

  # 可选：不同层级的最小质量评分阈值
  min_rating_by_level:
    0: null    # Level 0 要求高质量
    1: null    # Level 1 中等质量
    2: null    # Level 2 较低门槛
    3: null   # Level 3 不限制

  # 性能监控配置（记录到主日志文件）
  enable_performance_monitoring: true

  text_db_path: "data/embeddings/text.db"
  text_table_name: "text"
  output_dir: "data/answers"
  output_filename: "answers_text.jsonl"
  requests_path: "data/cache"
  sleep_interval: 60
  basic_rag_prompt: "config/prompts/basic_rag.md"

  embedding_db_path: "data/embeddings/multicommunities.db"  #no_entities_merge   embedding.db  enriched.db
  global_table_name: "communities"
  local_table_name: "entities"
  prompt_dir: "config/prompts"

  input_graph_path: "data/graphs/final_graph_develop.json"
  input_community_report_path: "data/reports/community_summaries_develop.jsonl"

database:
  graphdb:
    type: neo4j
    uri: "bolt://localhost:7687"
    username: "neo4j"
    password: "123456789"

logging:
  level: INFO                      # DEBUG / INFO / WARNING / ERROR
  log_file: "logs/superalloyKgRAG.log"

evaluation:
  # 评测数据路径
  qa_pairs_path: "data/evaluation_sets/qa_pairs.csv"
  ground_truth_path: "data/evaluation_sets/ground_truth.json"
  evaluation_sets_dir: "data/evaluation_sets"

  # 输出路径
  answers_output_dir: "data/answers"
  reports_output_dir: "data/reports"

  # 并发与性能控制
  max_concurrency: 5               # 最大并发请求数
  request_timeout: 600             # 单次请求超时时间(秒)
  retry_count: 2                   # 失败重试次数

  # 评分配置
  metrics: ["faithfulness", "relevance", "factual_accuracy"]

  # 评判 Prompt 路径
  prompts:
    l3_evaluation: "config/prompts/evaluation_l3.md"
    l4_evaluation: "config/prompts/evaluation_l4.md"

  # 评分权重配置
  scoring_weights:
    l1l2:
      keyword_match: 0.6
      semantic_similarity: 0.4
    l3:
      llm_judge: 0.8
      semantic_similarity: 0.2
    l4:
      conflict_identification: 0.3
      mechanism_invocation: 0.35
      solution_proposal: 0.35

  # 评判模型配置
  llm:
    model: "qwen-plus"   # qwen-plus  gemini-2.5-flash
    api_key: "${QWEN_API_KEY} " # ${GEMINI_API_KEY}  ${QWEN_API_KEY}
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
              #https://generativelanguage.googleapis.com/v1beta/openai/   https://dashscope.aliyuncs.com/compatible-mode/v1

reasoning:
  # Graph Reasoning Model Configuration
  model:
    gnn_type: "rgat"  # Relational Graph Attention Network
    hidden_dim: 1024
    num_layers: 3
    num_heads: 4
    dropout: 0.1
    use_query_aware: true
    use_edge_weights: true  # Use composite_importance as edge weights

  # Training Configuration
  training:
    batch_size: 64
    gradient_accumulation_steps: 4
    learning_rate: 0.001
    num_epochs: 100
    weight_decay: 0.0001
    early_stopping_patience: 10
    contrastive_num_samples: 1024   # 建议 1024~4096 之间试
    contrastive_temperature: 0.2
    contrastive_noise_std: 0.1

    # Self-supervised task weights
    loss_weights:
      link_prediction: 0.5
      contrastive: 0.5
      pseudo_query: 1.0

    # Negative sampling
    num_negatives: 5
    negative_sampling_strategy: "random"  # random, hard, mixed

    # Checkpointing
    checkpoint_dir: "data/reasoning/checkpoints"
    save_interval: 5  # epochs

  # Inference Configuration
  inference:
    top_k_nodes: 20
    ppr_alpha: 0.15  # Personalized PageRank restart probability
    ppr_max_iter: 100
    ppr_tol: 1.0e-6

    # Path extraction
    max_path_length: 5
    max_paths_per_query: 10
    min_path_score: 0.01

    # Query encoding
    use_cached_embeddings: true

  # Data paths
  data:
    graph_path: "data/graphs/final_graph_develop.json"
    entity_embeddings_db: "data/embeddings/multicommunities.db"
    entity_table: "entities"
    relationship_table: "relationships"
    pseudo_queries_path: "data/reasoning/pseudo_queries.jsonl"

  # Output paths
  output:
    model_path: "data/reasoning/model.pt"
    inference_results: "data/reasoning/inference_results.jsonl"
    attention_viz: "data/reasoning/attention_viz"

baseline:
  models:
    - name: "qwen3-max-2025-09-23"
      provider: "openai"
      api_key: "${QWEN_API_KEY}"
      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    - name: "Kimi-K2"         #kimi-k2-thinking
      provider: "openai"
      api_key: "${QWEN_API_KEY_2}"
      base_url: "https://llmapi.paratera.com/v1"
    - name: "DeepSeek-V3.2"   #deepseek-v3.2
      provider: "openai"
      api_key: "${QWEN_API_KEY_2}"
      base_url: "https://llmapi.paratera.com/v1"
    - name: "GLM-4.6"         #glm-4.6
      provider: "openai"
      api_key: "${QWEN_API_KEY_2}"
      base_url: "https://llmapi.paratera.com/v1"
    - name: "MiniMax-M2"
      provider: "openai"
      api_key: "${QWEN_API_KEY_2}"
      base_url: "https://llmapi.paratera.com/v1"